<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: url(#titleGrad); }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
      
      @keyframes pulseRing {
        0% { r: 45px; opacity: 0.8; }
        50% { r: 65px; opacity: 0.2; }
        100% { r: 45px; opacity: 0.8; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
        100% { transform: translateY(0px); }
      }
      @keyframes waveDash {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }

      .pulse { animation: pulseRing 4s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
      .float-1 { animation: floatParticle 5s infinite ease-in-out; }
      .float-2 { animation: floatParticle 7s infinite ease-in-out 1s; }
      .wave { stroke-dasharray: 20, 10; animation: waveDash 15s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16" />
  
  <!-- Dynamic background wave paths -->
  <path d="M 0 220 Q 300 120 600 200 T 1200 150" fill="none" stroke="#4f46e5" stroke-width="2" opacity="0.3" class="wave" />
  <path d="M 0 180 Q 400 260 800 160 T 1200 220" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.25" class="wave" />

  <!-- Decorative Network Nodes in background (far left and far right) -->
  <g opacity="0.4" class="float-1">
    <circle cx="100" cy="80" r="4" fill="#38bdf8" />
    <circle cx="180" cy="140" r="6" fill="#818cf8" />
    <line x1="100" y1="80" x2="180" y2="140" stroke="#6366f1" stroke-width="1" />
  </g>
  <g opacity="0.4" class="float-2">
    <circle cx="1060" cy="220" r="5" fill="#c084fc" />
    <circle cx="1120" cy="150" r="7" fill="#38bdf8" />
    <line x1="1060" y1="220" x2="1120" y2="150" stroke="#a855f7" stroke-width="1" />
  </g>

  <!-- Foreground Title and Subtitle Block (Centered & Protected) -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Icon / Emblem -->
    <g transform="translate(0, -50)">
      <circle cx="0" cy="0" r="32" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#glow)" />
      <!-- Computer / Shield Endpoint Icon -->
      <path d="M -12 -10 L 12 -10 A 2 2 0 0 1 14 -8 L 14 6 A 2 2 0 0 1 12 8 L -12 8 A 2 2 0 0 1 -12 -10 Z M -6 12 L 6 12 M 0 8 L 0 12" 
            fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Main Heading -->
    <text y="25" class="title" filter="url(#glow)">Awesome Endpoint Management</text>
    
    <!-- Subtitle -->
    <text y="62" class="subtitle">Curated SaaS Platforms, Enterprise UEM &amp; Open-Source Tools</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 105)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" class="badge-text">💻 UEM &amp; RMM</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-75, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" class="badge-text">⚡ Patch Mgmt</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(80, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" class="badge-text">🏷️ Asset Inventory</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(235, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" class="badge-text">🔓 Open Source</text>
      </g>
    </g>
  </g>
</svg>
